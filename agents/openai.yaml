openai_spec_version: 1.0
name: Requirement Solution Planner
description: 先判断输入是单需求还是多需求，再把模糊请求整理成可执行、可验证、可复核的方案。适用于需求拆解、实施规划、技术方案、路线图、里程碑、任务清单、优先级、排期、依赖分析、交付物定义、验收标准、复核机制、PRD/issue/handoff 转换，以及执行 R 项前的范围确认。需求不清时先追问；多需求默认先生成分批方案索引，再按需展开 R 项；功能、Bug、重构会补验证路径；长期项目会提示沉淀 CONTEXT.md 和 ADR。
display_name: Requirement Solution Planner
short_description: 把模糊需求变成可验证方案、R 项、issue brief 和执行切片。
default_prompt: 先判断这是单需求还是多需求；如果关键信息不足，先问我一个最重要的问题；否则给出可执行方案、成功标准、风险、验证路径和下一步建议。
category: productivity
icon: clipboard-check
